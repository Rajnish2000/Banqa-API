spring.application.name=bankmanagementRESTAPI

server.servlet.context-path=/api/v1

# Durable local simulator database. Use the mysql profile for a MySQL instance.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/bankmanagement;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never

jwt.secret=${JWT_SECRET:wewewrwerwersdfa34534dfgsgsfsfsdfgda}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}